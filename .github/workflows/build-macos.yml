name: Build macOS

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-macos.yml"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "Scripts/**"
      - "ThirdParty/Licenses/**"
      - "Sources/**"
      - "HAL/**"
      - "Shared/**"
      - "Packaging/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/build-macos.yml"
      - "Tests/**"
      - "Package.swift"
      - "Makefile"
      - "Scripts/**"
      - "ThirdParty/Licenses/**"
      - "Sources/**"
      - "HAL/**"
      - "Shared/**"
      - "Packaging/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Krasp
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          swift --version
          clang --version
          uname -a

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            echo "KRASP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "KRASP_VERSION=2026.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Verify source build
        run: make verify CONFIGURATION=release

      - name: Build installer package
        run: make dist CONFIGURATION=release VERSION="${KRASP_VERSION}" BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Verify bundled DPDFNet runtime
        run: KRASP_TEST_DPDFNET=1 KRASP_DPDFNET_RESOURCES="$PWD/.build/release/Krasp.app/Contents/Resources" swift test -c release --filter realDPDFNetLoadsProcessesAndResets

      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: Krasp-${{ env.KRASP_VERSION }}-macos-${{ runner.arch }}
          path: |
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Prerelease
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.KRASP_VERSION }}"
          name: "Krasp ${{ env.KRASP_VERSION }}"
          target_commitish: "${{ github.sha }}"
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.pkg
            dist/*.sha256

      - name: Publish Tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.pkg
            dist/*.sha256
